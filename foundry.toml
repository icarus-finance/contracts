[profile.default]
src = 'contracts'
out = 'out'
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = 'shanghai'

fs_permissions = [{ access = "read-write", path = "./"}]

[rpc_endpoints]
rise_testnet = "${RISE_TESTNET_RPC_URL}"
rise = "${RISE_RPC_URL}"

[etherscan]
rise_testnet = { key = "", url = "${RISE_TESTNET_ETHERSCAN_VERIFIER_URL}" }
rise = { key = "", url = "${RISE_ETHERSCAN_VERIFIER_URL}" }